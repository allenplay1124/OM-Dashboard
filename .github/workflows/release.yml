name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Package plugin
              run: |
                  rm -rf .release
                  mkdir -p .release/om-dashboard
                  cp main.js manifest.json .release/om-dashboard/
                  if [ -f styles.css ]; then
                    cp styles.css .release/om-dashboard/
                  fi
                  (cd .release && zip -r ../om-dashboard.zip om-dashboard)

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: om-dashboard.zip

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json styles.css om-dashboard.zip
